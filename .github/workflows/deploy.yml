name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: freebbs-agent-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate project
        run: bash scripts/ci-validate.sh

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.AGENT_DEPLOY_PATH || '/data/www/freebbs-agent' }}
      ENV_FILE: ${{ vars.FREEBBS_AGENT_ENV_FILE || '/etc/free-bbs/freebbs-agent.env' }}
      SERVICE_NAME: ${{ vars.AGENT_SERVICE_NAME || 'free-bbs-agent' }}
      HEALTHCHECK_URL: ${{ vars.AGENT_HEALTHCHECK_URL || 'http://127.0.0.1:5001/health' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release
        run: |
          set -euo pipefail
          ARCHIVE_PATH="/tmp/freebbs-agent-${GITHUB_SHA}.tar.gz"
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf "$ARCHIVE_PATH" .

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "[deploy] SSH key fingerprint used by GitHub Actions:"
          ssh-keygen -lf ~/.ssh/id_ed25519.pub

      - name: Check SSH auth
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo '[deploy] ssh auth ok'"

      - name: Upload release artifact
        run: |
          set -euo pipefail
          ARCHIVE_PATH="/tmp/freebbs-agent-${GITHUB_SHA}.tar.gz"
          scp \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -P "$DEPLOY_PORT" \
            "$ARCHIVE_PATH" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/freebbs-agent-${GITHUB_SHA}.tar.gz"

      - name: Start deployment on app server
        run: |
          set -euo pipefail
          STATUS_DIR="/tmp/freebbs-agent-deploy-${GITHUB_SHA}"
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; \
             STATUS_DIR='$STATUS_DIR'; \
             RELEASE_DIR=/tmp/freebbs-agent-release-${GITHUB_SHA}; \
             rm -rf \"\$STATUS_DIR\" \"\$RELEASE_DIR\"; \
             mkdir -p \"\$STATUS_DIR\" \"\$RELEASE_DIR\"; \
             tar -xzf /tmp/freebbs-agent-${GITHUB_SHA}.tar.gz -C \"\$RELEASE_DIR\"; \
             nohup env \
               DEPLOY_DIR='$DEPLOY_PATH' \
               FREEBBS_AGENT_ENV_FILE='$ENV_FILE' \
               AGENT_SERVICE_NAME='$SERVICE_NAME' \
               HEALTHCHECK_URL='$HEALTHCHECK_URL' \
               bash -c 'release_dir=\"\$1\"; status_dir=\"\$2\"; if cd \"\$release_dir\" && bash scripts/deploy.sh; then touch \"\$status_dir/success\"; rm -rf \"\$release_dir\" /tmp/freebbs-agent-${GITHUB_SHA}.tar.gz; else exit_code=\$?; printf \"%s\\n\" \"\$exit_code\" > \"\$status_dir/failed\"; fi' \
               bash \"\$RELEASE_DIR\" \"\$STATUS_DIR\" \
               > \"\$STATUS_DIR/deploy.log\" 2>&1 < /dev/null & \
             echo \$! > \"\$STATUS_DIR/pid\""

      - name: Wait for deployment result
        run: |
          set -euo pipefail
          STATUS_DIR="/tmp/freebbs-agent-deploy-${GITHUB_SHA}"
          for attempt in $(seq 1 120); do
            result="$(ssh \
              -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "if [ -f '$STATUS_DIR/success' ]; then echo success; elif [ -f '$STATUS_DIR/failed' ]; then echo failed; elif [ -f '$STATUS_DIR/pid' ] && kill -0 \"\$(cat '$STATUS_DIR/pid')\" 2>/dev/null; then echo running; else echo lost; fi" \
              || echo unreachable)"
            case "$result" in
              success)
                echo "[deploy] completed successfully"
                exit 0
                ;;
              failed|lost)
                echo "[deploy] failed with state: $result" >&2
                ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -p "$DEPLOY_PORT" \
                  "$DEPLOY_USER@$DEPLOY_HOST" "cat '$STATUS_DIR/deploy.log'" || true
                exit 1
                ;;
              *)
                echo "[deploy] still running (attempt $attempt/120)"
                sleep 15
                ;;
            esac
          done
          echo "[deploy] timed out waiting for the app server" >&2
          exit 1
